<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, system-ui, Arial, sans-serif;
      background-color: #000;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 140px;
      height: auto;
    }

    .login-container {
      background: #0f0f10;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 22px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #111;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: white;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #ddd;
    }

    .error {
      color: red;
      margin-top: 10px;
      text-align: center;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .login-container {
        padding: 20px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo">
    <img src="logo.png" alt="Logo">
  </div>

  <!-- Formulario de login -->
  <div class="login-container">
    <h2>Iniciar Sesión</h2>

    <label for="username">Correo electronico</label>
    <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="off" />

    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="Ingresa tu contraseña" />

    <button onclick="login()">Entrar</button>

    <p style="text-align: center;">SOLICITA A UN ASESOR TU USUARIO</p>

    <div class="error" id="error-msg"></div>
  </div>

  <script>
    // 👥 Usuarios y contraseñasv
    const usuarios = {
      "Franja0784@gmail.com": "88163150",
      "18466137": "18466137",
      "pedro291981@gmail.com": "97612275"
      // Agrega más usuarios aquí ejemplgigyi
    };

    function login() {
      const usuario = document.getElementById("username").value.trim();
      const clave = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("error-msg");

      if (usuarios[usuario] && usuarios[usuario] === clave) {
        // Redirige al archivo HTML con el mismo nombre que el usuario
        window.location.href = `${usuario}.html`;
      } else {
        errorMsg.textContent = "Usuario o contraseña incorrectos.";
      }
    }
  </script>

</body>
</html>
